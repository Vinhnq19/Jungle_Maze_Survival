services:
  mongo:
    image: mongo:8.0
    profiles: ["account"]
    # Compass trên Windows truy cập được; không mở MongoDB ra LAN/Internet.
    ports:
      - "127.0.0.1:${MONGO_PORT:-27018}:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "quit(db.adminCommand({ping:1}).ok ? 0 : 1)"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  api:
    profiles: ["account"]
    build:
      context: .
      dockerfile: Api/Dockerfile
    env_file:
      - .env
    ports:
      - "${API_PUBLISH_HOST:-${PUBLISH_HOST:-127.0.0.1}}:${API_PORT:-5000}:5000/tcp"
    environment:
      Mongo__ConnectionString: mongodb://mongo:27017
      Mongo__Database: jungle_maze
      ALLOW_LOCAL_HTTP: "true"
      Swagger__Enabled: "${SWAGGER_ENABLED:-true}"
      RoomControl__BaseUrl: http://game-server:7780
      MATCH_RESULT_TOKEN: "${MATCH_RESULT_TOKEN:-}"
    depends_on:
      mongo:
        condition: service_healthy

  game-server:
    build:
      context: .
      dockerfile: GameServer/Dockerfile
    env_file:
      - .env
    ports:
      - "${GAME_PUBLISH_HOST:-${PUBLISH_HOST:-127.0.0.1}}:${GAME_PORT:-7777}:7777/udp"
      - "${WS_PUBLISH_HOST:-127.0.0.1}:${WS_PORT:-7781}:7781/tcp"
    environment:
      GAME_BIND_ADDRESS: "${GAME_BIND_ADDRESS:-0.0.0.0}"
      GAME_PORT: "7777"
      WS_ENABLED: "${WS_ENABLED:-true}"
      WS_BIND_ADDRESS: 0.0.0.0
      WS_PORT: "7781"
      MATCH_PROFILE: "${MATCH_PROFILE:-main}"
      MAX_PLAYERS: "${MAX_PLAYERS:-10}"
      TICK_RATE: "${TICK_RATE:-30}"
      AUTH_MODE: "${AUTH_MODE:-RoomCode}"
      AUTH_TIMEOUT_MS: "${AUTH_TIMEOUT_MS:-5000}"
      METRICS_INTERVAL_SECONDS: "${METRICS_INTERVAL_SECONDS:-5}"
      ROOM_CONTROL_BIND_ADDRESS: 0.0.0.0
      ROOM_CONTROL_PORT: "7780"
      MAX_ROOM_PLAYERS: "${MAX_ROOM_PLAYERS:-10}"
      MAX_TOTAL_PLAYERS: "${MAX_TOTAL_PLAYERS:-50}"
      MAX_ROOMS: "${MAX_ROOMS:-5}"
      MAX_ROOMS_PER_USER: "${MAX_ROOMS_PER_USER:-2}"
      ROOM_EMPTY_TTL_SECONDS: "${ROOM_EMPTY_TTL_SECONDS:-600}"
      MATCH_RESULTS_API_URL: "${MATCH_RESULTS_API_URL:-http://api:5000/internal/match-results}"
      MATCH_RESULT_TOKEN: "${MATCH_RESULT_TOKEN:-}"
      MATCH_OUTBOX_PATH: "${MATCH_OUTBOX_PATH:-/app/data/match-outbox}"
    volumes:
      - game-outbox:/app/data/match-outbox

volumes:
  mongo-data:
  game-outbox:
